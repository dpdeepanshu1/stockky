name: Stockky Scheduler

on:
  schedule:
    # Every 30 min, 02:00-11:30 UTC = 07:30-17:00 IST, Mon-Fri.
    # run_once.py itself only acts within 08:15-16:30 IST, so the extra
    # ticks near the edges of this window are harmless no-ops — this is
    # just here to comfortably cover the whole trading day.
    - cron: "0,30 2-11 * * 1-5"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r services/scheduler-service/requirements.txt

      # Wake up all microservices before running the scheduler. Also pings
      # SCHEDULER_URL (scheduler-service's own public URL) — that service
      # runs its own internal keep-alive loop for everything else, but
      # nothing was keeping IT awake: as a free-tier Render web service it
      # sleeps after 15 min of no external traffic just like any other,
      # which would silently stop its internal scan/keep-alive jobs from
      # running at all until something hit it again. This closes that gap.
      - name: Wake up services
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          MARKET_DATA_URL: ${{ secrets.MARKET_DATA_URL }}
          TECHNICAL_URL: ${{ secrets.TECHNICAL_URL }}
          FUNDAMENTAL_URL: ${{ secrets.FUNDAMENTAL_URL }}
          DECISION_URL: ${{ secrets.DECISION_URL }}
          NEWS_URL: ${{ secrets.NEWS_URL }}
          EVENT_TRACKER_URL: ${{ secrets.EVENT_TRACKER_URL }}
          PREDICTION_URL: ${{ secrets.PREDICTION_URL }}
          NOTIFICATION_URL: ${{ secrets.NOTIFICATION_URL }}
          MARKET_SENTIMENT_URL: ${{ secrets.MARKET_SENTIMENT_URL }}
          TRAINING_URL: ${{ secrets.TRAINING_URL }}
          SCHEDULER_URL: ${{ secrets.SCHEDULER_URL }}
        run: |
          echo "Pinging all services to wake them up (preventing cold starts)..."
          # Individual pings to ensure each service is woken
          curl -I $API_GATEWAY_URL/health || true
          curl -I $MARKET_DATA_URL/health || true
          curl -I $TECHNICAL_URL/health || true
          curl -I $FUNDAMENTAL_URL/health || true
          curl -I $DECISION_URL/health || true
          curl -I $NEWS_URL/health || true
          curl -I $EVENT_TRACKER_URL/health || true
          curl -I $PREDICTION_URL/health || true
          curl -I $NOTIFICATION_URL/health || true
          curl -I $MARKET_SENTIMENT_URL/health || true
          curl -I $TRAINING_URL/health || true
          curl -I $SCHEDULER_URL/health || true

          # Also call the API Gateway's /wake/all endpoint (new) to wake all via one call
          curl -X POST $API_GATEWAY_URL/wake/all || true

          echo "Waiting 60 seconds for services to fully spin up..."
          sleep 60

      - name: Run scheduler tick
        env:
          API_GATEWAY_URL: ${{ secrets.API_GATEWAY_URL }}
          EVENT_TRACKER_URL: ${{ secrets.EVENT_TRACKER_URL }}
          NOTIFICATION_URL: ${{ secrets.NOTIFICATION_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python services/scheduler-service/run_once.py