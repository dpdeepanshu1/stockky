version: "3.9"

services:
  market-data-service:
    build: ./services/market-data-service
    ports:
      - "8001:8001"
    environment:
      UPSTASH_REDIS_REST_URL: "https://adapted-lion-167573.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "gQAAAAAAAo6VAAIgcDEzN2UwNWRkYmYwMWU0OWE4YjYxYjY1ZDQ5NWM2ZDgxMw"

  technical-analysis-service:
    build: ./services/technical-analysis-service
    ports:
      - "8002:8002"
    environment:
      MARKET_DATA_URL: https://stockky-market-data.onrender.com
    depends_on:
      - market-data-service

  fundamental-analysis-service:
    build: ./services/fundamental-analysis-service
    ports:
      - "8003:8003"
    environment:
      MARKET_DATA_URL: https://stockky-market-data.onrender.com
    depends_on:
      - market-data-service

  news-intelligence-service:
    build: ./services/news-intelligence-service
    ports:
      - "8005:8005"

  event-tracker-service:
    build: ./services/event-tracker-service
    ports:
      - "8006:8006"
    environment:
      UPSTASH_REDIS_REST_URL: "https://adapted-lion-167573.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "gQAAAAAAAo6VAAIgcDEzN2UwNWRkYmYwMWU0OWE4YjYxYjY1ZDQ5NWM2ZDgxMw"

  prediction-service:
    build: ./services/prediction-service
    ports:
      - "8007:8007"
    environment:
      MARKET_DATA_URL: https://stockky-market-data.onrender.com
    volumes:
      - ./data/prediction-model:/app/model-store
    depends_on:
      - market-data-service

  notification-service:
    build: ./services/notification-service
    ports:
      - "8008:8008"
    environment:
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      UPSTASH_REDIS_REST_URL: "https://adapted-lion-167573.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "gQAAAAAAAo6VAAIgcDEzN2UwNWRkYmYwMWU0OWE4YjYxYjY1ZDQ5NWM2ZDgxMw"

  decision-engine-service:
    build: ./services/decision-engine-service
    ports:
      - "8004:8004"
    environment:
      TECHNICAL_URL: https://technical-analysis-service-zhnc.onrender.com
      FUNDAMENTAL_URL: https://fundamental-analysis-service.onrender.com
      NEWS_URL: https://news-intelligence-service.onrender.com
      EVENT_URL: https://event-tracker-service-m1lw.onrender.com
      PREDICTION_URL: https://prediction-service-wowb.onrender.com
    depends_on:
      - technical-analysis-service
      - fundamental-analysis-service
      - news-intelligence-service
      - event-tracker-service
      - prediction-service

  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8000:8000"
    environment:
      DECISION_URL: https://decision-engine-service-0hg6.onrender.com
      NOTIFICATION_URL: https://notification-service-36py.onrender.com
      UPSTASH_REDIS_REST_URL: "https://adapted-lion-167573.upstash.io"
      UPSTASH_REDIS_REST_TOKEN: "gQAAAAAAAo6VAAIgcDEzN2UwNWRkYmYwMWU0OWE4YjYxYjY1ZDQ5NWM2ZDgxMw"
    depends_on:
      - decision-engine-service
      - notification-service

  scheduler-service:
    build: ./services/scheduler-service
    environment:
      API_GATEWAY_URL: https://api-gateway-wizr.onrender.com
      EVENT_TRACKER_URL: https://event-tracker-service-m1lw.onrender.com
      NOTIFICATION_URL: https://notification-service-36py.onrender.com
      SCAN_INTERVAL_MINUTES: "30"
    volumes:
      - ./reports:/app/reports
    depends_on:
      - api-gateway
      - event-tracker-service
      - notification-service

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: https://api-gateway-wizr.onrender.com
    depends_on:
      - api-gateway

  market-sentiment-service:
    build: ./services/market-sentiment-service
    ports:
      - "8009:8009"
    environment:
      - REDIS_URL=${UPSTASH_REDIS_REST_URL}
    depends_on:
      - market-data-service

  # ===================== CORRECTED training-service =====================
  training-service:
    build: ./services/training-service          # path to your Dockerfile
    ports:
      - "8010:5001"                             # external 8010 → container 5001
    environment:
      - SERVICE_URL=http://training-service:5001   # internal service discovery
      - PORT=5001                               # container port
      - DATABASE_URL=${TRAINING_DATABASE_URL:-sqlite:///./data/training.db}
      - MODEL_STORE_PATH=/app/model-store
    volumes:
      - ./data/training-model:/app/model-store   # persistent model storage
      - ./data/training-db:/app/data             # persistent SQLite database
    depends_on:
      - market-data-service                      # only needs market data
    restart: unless-stopped